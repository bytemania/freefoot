<div class="debug-inspector">
  <section class="inspector-card">
    <h3 class="inspector-title" data-i18n="panels.carrierDecision">Carrier Decision</h3>
    <div class="carrier-body">No ball carrier</div>
  </section>

  <section class="inspector-card">
    <h3 class="inspector-title" data-i18n="panels.playerInspector">Player Inspector</h3>
    <div class="player-body">Click any player on the pitch to inspect.</div>
  </section>

  <section class="inspector-card inspector-timeline-card">
    <div class="timeline-header">
      <h3 class="inspector-title" data-i18n="panels.eventTimeline">Event Timeline</h3>
      <div class="timeline-filters">
        <button type="button" class="filter-btn is-active" data-filter="ALL">ALL</button>
        <button type="button" class="filter-btn" data-filter="GOAL">GOAL</button>
        <button type="button" class="filter-btn" data-filter="SHOT">SHOT</button>
        <button type="button" class="filter-btn" data-filter="PASS_FAIL">PASS FAIL</button>
        <button type="button" class="filter-btn" data-filter="FOUL">FOUL</button>
        <button type="button" class="filter-btn" data-filter="CARD">CARD</button>
        <button type="button" class="filter-btn" data-filter="SET_PIECE">SET PIECE</button>
      </div>
    </div>
    <div class="timeline-list"></div>
  </section>
</div>
