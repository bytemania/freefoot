# Referee model (design item 12, §9b, §10).

# pCard = sigmoid(y0 + y1 * severity + y2 * n(aggression))
card:
  y0: {value: -2.3, initial: false}
  y1: {value: 1.5, initial: false}
  y2: {value: 1.0, initial: true}

# A card is red when severity >= severity.redMin and u < r0 + r1 * severity.
red:
  r0: {value: 0.02, initial: false}
  r1: {value: 0.06, initial: false}

severity:
  fromBehind: {value: 0.4, initial: true}
  fastTackle: {value: 0.3, initial: true}
  fastTackleSpeed: {value: 6, initial: true}
  lastMan: {value: 0.5, initial: true}
  redMin: {value: 0.95, initial: false}

# Play on while the fouled team keeps the ball for advSeconds and gains at least advMin metres.
advantage:
  advSeconds: {value: 3, initial: true}
  advMin: {value: 5, initial: true}

# Offside tolerance in metres.
offsideTolerance: {value: 0, initial: true}

# Seconds added to the half's accumulator per occurrence.
addedTime: {perGoal: 30, perSubstitution: 30, perCard: 20, perInjuryStoppage: 30}

penaltyDistance: 11
