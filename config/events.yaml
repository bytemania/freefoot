# Event registry (design item 14, §13): the single list of event types.
# Types may be added but never renamed. `actors` lists the required actor roles:
# `actor` is actorIndex, `secondary` is secondaryIndices[0]. `highlight` marks types
# that can trigger a Best Moment (thresholds live in playback.yaml).
types:
  GOAL:
    actors: [actor]
    meta: {kind: {type: string, values: [OPEN_PLAY, PENALTY, FREE_KICK, OWN_GOAL]}, z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: [{metric: goals, side: actor, when: {kind: [OPEN_PLAY, PENALTY, FREE_KICK]}}, {metric: goals, side: opponent, when: {kind: OWN_GOAL}}]
  ASSIST:
    actors: [actor, secondary]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  SHOT:
    actors: [actor]
    meta: {result: {type: string, values: [ON_TARGET, OFF_TARGET, BLOCKED, WOODWORK]}, xg: number, psxg: number, goalY: number, goalZ: number, vShot: number, distance: number, bodyPart: {type: string, values: [FOOT, HEAD]}, z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: [{metric: shots, side: actor}, {metric: xG, side: actor, incFrom: xg}, {metric: shotsOnTarget, side: actor, when: {result: ON_TARGET}}]
  BIG_CHANCE:
    actors: [actor]
    meta: {xg: number}
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: []
  KEY_PASS:
    actors: [actor, secondary]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  CROSS:
    actors: [actor]
    meta: {completed: boolean, z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  DRIBBLE:
    actors: [actor]
    meta: {won: boolean}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  TOUCH_IN_BOX:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  PASS:
    actors: [actor, secondary]
    meta: {kind: {type: string, values: [SHORT, LONG, THROUGH, SWITCH, CROSS, GK_THROW, GK_KICK]}, completed: boolean, z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: [{metric: passes, side: actor}, {metric: passesCompleted, side: actor, when: {completed: true}}]
  POSSESSION_LOST:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  MISCONTROL:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  TACKLE:
    actors: [actor, secondary]
    meta: {won: boolean}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  INTERCEPTION:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  CLEARANCE:
    actors: [actor]
    meta: {z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  BLOCK:
    actors: [actor]
    meta: {z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  AERIAL_DUEL:
    actors: [actor, secondary]
    meta: {won: boolean, z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  RECOVERY:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  SAVE:
    actors: [actor]
    meta: {kind: {type: string, values: [HELD, PARRIED, TIPPED]}, psxg: number, z: number, maxZ: number, heightBand: {type: string, values: [GROUND, LOW, WAIST, HEAD, HIGH, OVER_BAR]}}
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: []
  CLAIM:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  PUNCH:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  SMOTHER:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  GK_DISTRIBUTION:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  KICK_OFF:
    actors: []
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  THROW_IN:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  GOAL_KICK:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  CORNER:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  FREE_KICK:
    actors: [actor]
    meta: {direct: boolean}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  PENALTY_AWARDED:
    actors: [actor, secondary]
    meta: {}
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: []
  DROP_BALL:
    actors: []
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 1
    stats: []
  FOUL:
    actors: [actor, secondary]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: [{metric: foulsCommitted, side: actor}]
  OFFSIDE:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  YELLOW_CARD:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  RED_CARD:
    actors: [actor]
    meta: {secondYellow: boolean}
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: []
  INJURY:
    actors: [actor]
    meta: {level: {type: string, values: [LIGHT, MEDIUM, HIGH]}}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  INJURY_STOPPAGE:
    actors: [actor]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 1
    stats: []
  SUBSTITUTION:
    actors: [actor, secondary]
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  FORMATION_CHANGE:
    actors: []
    meta: {formationId: string, baseFormationId: string, plan: {type: string, values: [A, B]}, tacticId: string}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  FORCED_DECISION_REQUIRED:
    actors: [actor]
    meta: {reason: {type: string, values: [HIGH_INJURY, GK_SENT_OFF]}}
    highlight: false
    forcesPause: true
    minVariations: 1
    stats: []
  ADDED_TIME:
    actors: []
    meta: {minutes: number}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  HALF_TIME:
    actors: []
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 1
    stats: []
  FULL_TIME:
    actors: []
    meta: {}
    highlight: false
    forcesPause: false
    minVariations: 1
    stats: []
  # A coach shout (tactics/Shouts.js): secondaryIndices lists the players who reacted, the `positive` accepted
  # ones first, then the `negative` ones (rejections, backfires and, when overloaded, the stressed rest).
  SHOUT_REACTION:
    actors: []
    meta: {shout: string, positive: number, negative: number, overloaded: boolean}
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: []
  # VAR (officiating/VarSystem.js, config/var.yaml), only in a match with `var: true`. VAR_CHECK opens a review of
  # the actor's incident (the scorer, the fouler, the booked player); secondaryIndices holds the other player
  # involved (the assister or the fouled player), when there is one. Commentary has one pool per `commentaryBy`
  # value (commentary/<locale>.yaml: VAR_CHECK: {GOAL: [...], ...}).
  VAR_CHECK:
    actors: [actor]
    meta: {incident: {type: string, values: [GOAL, PENALTY, POSSIBLE_PENALTY, RED_CARD]}}
    commentaryBy: incident
    highlight: true
    forcesPause: false
    minVariations: 3
    stats: []
  # VAR_DECISION settles it. On an overturn, secondaryIndices lists the players who react: the side the decision
  # favours first (`positive` of them), then the other side. A disallowed goal takes the goal back off the stats
  # (`assist` is the assister whose assist goes too, or -1); an upgrade rescinds the yellow (the RED_CARD follows).
  VAR_DECISION:
    actors: [actor]
    meta:
      incident: {type: string, values: [GOAL, PENALTY, POSSIBLE_PENALTY, RED_CARD]}
      outcome: {type: string, values: [goalConfirmed, goalDisallowed, penaltyConfirmed, penaltyOverturned, penaltyAwarded, noPenalty, redCardUpgraded, yellowStands]}
      overturned: boolean
      addedSeconds: number
      positive: number
      negative: number
      assist: number
    commentaryBy: outcome
    highlight: false
    forcesPause: false
    minVariations: 3
    stats: [{metric: goals, side: actor, inc: -1, when: {outcome: goalDisallowed}}]

# Metrics computed in metrics.js from the counters above, not stored.
derived: [possessionPct, passCompletionPct]

# Metrics defined per match rather than per team.
matchLevel: [strongWinRate]
