# Engine tuning coefficients (design §9a, §9b). Every value starts as `initial: true`
# and is changed only by calibration. `rate: true` values are per second;
# the engine converts them to per-tick values in create().

# Carrier decision model (§9a, §9b). w = feature weights per action.
decision:
  w:
    pass:
      laneSafety: {value: 1.05, initial: false}
      progress: {value: 0.90, initial: false}
      receiverFree: {value: 0.55, initial: false}
    dribble:
      space: {value: 0.78, initial: false}
      skill: {value: 0.45, initial: false}
    shot:
      xg: {value: 2.4, initial: false}
    cross:
      wideZone: {value: 0.6, initial: false}
      boxMates: {value: 0.75, initial: false}
    hold:
      free: {value: 0.80, initial: false}
  n0: {value: 0.55, initial: false}
  n1: {value: 0.5, initial: true}
  visionMin: {value: 12, initial: true}
  minPassDist: {value: 5, initial: true}
  maxPassDist: {value: 60, initial: true}
  shotMaxDist: {value: 30, initial: false}
  dribbleStep: {value: 8, initial: true}
  offsidePenalty: {value: 3.5, initial: false}
  settleTicks: {value: 48, initial: false}
  settlePressureTicks: {value: 16, initial: false}
  clearanceScore: {value: 1.2, initial: true}
  clearancePressure: {value: 0.5, initial: true}
  clearanceZone: {value: 25, initial: true}
  features:
    laneSafetyDist: {value: 8, initial: true}
    progressScale: {value: 30, initial: true}
    pressureDist: {value: 5, initial: true}
    spaceDist: {value: 10, initial: true}
    spaceConeDeg: {value: 60, initial: true}
    boxMatesDiv: {value: 3, initial: true}
    dribbleAngleDeg: {value: 35, initial: true}
    interruptDist: {value: 2, initial: true}

