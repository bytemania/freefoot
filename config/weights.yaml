# Engine tuning coefficients (design §9a, §9b). Every value starts as `initial: true`
# and is changed only by calibration. `rate: true` values are per second;
# the engine converts them to per-tick values in create().

# Attribute contrast (state/PlayerMatchState.js getEffectiveAttribute): every
# attribute is read as pivot + contrast x (raw - pivot) before fitness and injury.
# Calibrated against the closing-odds strength tiers in config/benchmarks/top5-10yr.json.
attributes:
  pivot: {value: 15, initial: true}
  contrast: {value: 0.32, initial: false}

# Carrier decision model (§9a, §9b). w = feature weights per action.
decision:
  offsideMisjudge: {value: 0.45, initial: false}  # m, +-error in the carrier reading of the offside line
  throughLineGap: {value: 4, initial: false}  # m, a THROUGH ball goes to a receiver at most this far short of the line
  tti:
    reactionSec: {value: 0.3, initial: false}  # s, a defender reads the pass before running
    marginScale: {value: 0.5, initial: false}  # s, steepness of the margin -> safety curve
  w:
    pass:
      laneSafety: {value: 1.05, initial: false}
      progress: {value: 0.90, initial: false}
      receiverFree: {value: 0.55, initial: false}
      # Kinematic interception (Perception.passInterceptMargin): + tti x sigmoid(margin / marginScale), margin being the
      # seconds by which the ball beats the fastest opponent to the target or the lane; + xt x the gain in static
      # expected threat (xT.js) from the passer to the target (lead point for a ball in behind).
      tti: {value: 0.25, initial: false}
      xt: {value: 1, initial: false}
    dribble:
      space: {value: 0.3, initial: false}
      skill: {value: 0.45, initial: false}
    shot:
      xg: {value: 0.75, initial: false}
      bias: {value: -0.15, initial: false}
      # Shot propensity by location (CarrierDecision.js shotUtility): inside the
      # opponent's box +box x xG (good chances are taken decisively, tight angles
      # are not), +clearLane with an empty shooting cone, +oneOnOne with no
      # outfield defender goal-side; outside it -longRange, cut by up to
      # longRangeSkill x space x technique/finishing (speculative shots stay rare).
      box: {value: 1.2, initial: false}
      clearLane: {value: 0.03, initial: false}
      oneOnOne: {value: 0.05, initial: false}
      # +boxFree x (1 - pressure) in the box with an empty shooting cone: a free carrier with a clear lane
      # takes the shot instead of holding or passing sideways for a marginal gain.
      boxFree: {value: 0.4, initial: false}
      longRange: {value: 0.1, initial: false}
      longRangeSkill: {value: 0.8, initial: false}
    cross:
      wideZone: {value: 0.6, initial: false}
      boxMates: {value: 0.75, initial: false}
    hold:
      free: {value: 0.80, initial: false}
  n0: {value: 0.55, initial: false}
  n1: {value: 0.5, initial: true}
  visionMin: {value: 12, initial: true}
  minPassDist: {value: 5, initial: true}
  maxPassDist: {value: 60, initial: true}
  shotMaxDist: {value: 30, initial: false}
  dribbleStep: {value: 8, initial: true}
  offsidePenalty: {value: 3.5, initial: false}
  settleTicks: {value: 90, initial: false}
  settlePressureTicks: {value: 24, initial: false}
  clearanceScore: {value: 1.2, initial: true}
  clearancePressure: {value: 0.5, initial: true}
  clearanceZone: {value: 25, initial: true}
  # Game state: shot-bias shift for the leading / trailing side, scaled by time played.
  gameState:
    leadShotBias: {value: -0.14, initial: false}
    trailShotBias: {value: 0.07, initial: false}
  features:
    laneSafetyDist: {value: 8, initial: true}
    progressScale: {value: 30, initial: true}
    pressureDist: {value: 5, initial: true}
    spaceDist: {value: 10, initial: true}
    spaceConeDeg: {value: 60, initial: true}
    boxMatesDiv: {value: 3, initial: true}
    dribbleAngleDeg: {value: 35, initial: true}
    interruptDist: {value: 2, initial: true}

pass:
  p0: {value: 2.3, initial: false}
  p1: {value: 2.0, initial: false}
  p2: {value: 1.4, initial: false}
  p3: {value: 1.2, initial: false}
  p4: {value: 1.2, initial: false}
  p5: {value: 1.2, initial: false}
  e0: {value: 0.05, initial: true}

firstTouch:
  t0: {value: 2.7, initial: false}
  t1: {value: 1.6, initial: false}
  t2: {value: 1.3, initial: false}
  t3: {value: 1, initial: true}
  t4: {value: 1.2, initial: false}
  # Composure steadies a touch (t5 x n(composure)); a ball arriving above the ground is harder to control (-t6 per metre of height, capped at 2 m).
  t5Composure: {value: 0.4, initial: false}
  t6Height: {value: 0.35, initial: false}
  # A controlled touch is heavy (the ball runs on ahead instead of sticking to the foot) with
  # sigmoid(heavyOffset + heavySpeed x ballSpeed/20 + heavyPressure x pressure - heavySkill x n(firstTouch)). The same single draw
  # decides the outcome (below pClean clean, below pControl heavy, above it a spill). A heavy touch knocks the ball
  # heavyMin to heavyMin + heavySpan metres ahead, leaving it rolling at heavyKeepSpeed x distance. heavyOffset -20 turns heavy touches off.
  heavyOffset: {value: -3.8, initial: false}
  heavySpeed: {value: 1.2, initial: false}
  heavyPressure: {value: 1.0, initial: false}
  heavySkill: {value: 1.0, initial: false}
  heavyMin: {value: 1.5, initial: false}
  heavySpan: {value: 2.0, initial: false}
  heavyKeepSpeed: {value: 1.0, initial: false}

dribble:
  d0: {value: 0.2, initial: false}
  d1: {value: 1.6, initial: false}
  d2: {value: 1.2, initial: false}
  d3: {value: 1.0, initial: true}
  d4: {value: 1.5, initial: false}
  d5: {value: 1.3, initial: false}

tackle:
  bookedAttempt: {value: 0.7, initial: false}  # tackle attempt multiplier for a booked player
  bookedFoul: {value: -1.0, initial: false}  # foul logit offset for a booked player
  boxAttempt: {value: 0.6, initial: false}  # tackle attempt multiplier inside own box
  boxFoul: {value: -2.0, initial: false}  # foul logit offset inside own box
  looseP: {value: 0.25, initial: false}  # a won tackle pokes the ball loose
  k0: {value: -0.2, initial: false}
  k1: {value: 1.8, initial: false}
  k2: {value: 1.2, initial: false}
  k3: {value: 1.6, initial: false}
  k4: {value: 1.2, initial: false}
  f0: {value: -2.85, initial: false}
  f1: {value: 1, initial: true}
  f2: {value: 1.3, initial: false}
  f3: {value: 1, initial: true}
  f4: {value: 1, initial: true}
  f5: {value: 1, initial: true}
  range: {value: 1.4, initial: true}
  attemptP: {value: 0.055, initial: false}
  aggressionGain: {value: 0.4, initial: true}

aerial:
  behindP: {value: 0.2, initial: false}  # a defensive header in the box goes behind for a corner
  a0: {value: 0, initial: true}
  a1: {value: 1, initial: true}
  radius: {value: 2.5, initial: true}

shot:
  r2: {value: 0.8, initial: false}  # error radius growth per 11 m beyond the penalty spot
  blockBehindP: {value: 0.5, initial: false}  # a blocked shot carries on wide of goal
  r0: {value: 4.0, initial: false}
  r1: {value: 0.8, initial: false}
  postWidth: {value: 0.12, initial: true}
  thetaFar: {value: 0.35, initial: true}
  aimZ: {value: 0.5, initial: true}
  aimZFinishing: {value: 1.8, initial: true}
  aimZFinishingMin: {value: 15, initial: true}
  s0: {value: 24, initial: true}
  s1: {value: 6, initial: true}
  headS0: {value: 12, initial: true}
  headS1: {value: 4, initial: true}
  oneOnOneDist: {value: 16, initial: true}
  goalHalfWidth: {value: 3.66, initial: true}
  goalHeight: {value: 2.44, initial: true}

save:
  g6: {value: 1.2, initial: false}  # save logit per 10 m beyond the penalty spot
  g0: {value: 0.8, initial: false}
  g1: {value: 1.3, initial: false}
  g2: {value: 1.1, initial: false}
  g3: {value: 1, initial: true}
  g4: {value: 1, initial: true}
  g5: {value: 1, initial: true}
  h1: {value: 18, initial: true}
  tippedDist: {value: 0.6, initial: false}

keeper:
  looseGoalSpeed: {value: 14, initial: false}  # m/s, a non-shot ball slower than this is gathered by the keeper
  q0: {value: 0, initial: true}
  q1: {value: 1, initial: true}
  q2: {value: 1, initial: true}
  depthBase: {value: 1, initial: true}
  depthScale: {value: 5, initial: true}
  depthMin: {value: 0.5, initial: true}
  depthMax: {value: 6, initial: true}
  depthRef: {value: 40, initial: true}
  commandBase: {value: 4, initial: true}
  commandPer: {value: 0.3, initial: true}
  reachFactor: {value: 0.5, initial: true}
  crowdRadius: {value: 2, initial: true}
  throwMax: {value: 30, initial: true}

contest:
  deflectP: {value: 0.25, initial: false}  # a won contest only deflects the ball
  deflectTilt: {value: 0.8, initial: false}  # tan of the max deflection turn
  deflectKeep: {value: 0.5, initial: false}  # share of ball speed kept by a deflection
  c0: {value: -1.8, initial: false}
  c1: {value: 1.8, initial: false}
  c2: {value: 1, initial: true}
  c3: {value: 1, initial: true}
  defl: {value: 25, initial: true}
  groundReach: {value: 1, initial: true}
  standHeight: {value: 2, initial: true}
  jumpHeight: {value: 0.7, initial: true}
  # Ball-to-body blocking: players are vertical cylinders (radius + ball radius, height; a player going for the
  # ball reaches `bodyJumpBonus` higher). The kicker / last toucher is exempt for `bodyGraceTicks`. A body hit is
  # controlled (firstTouch) or deflected: speed kept `bodyKeep`, direction turned by up to atan(`bodyScatter`).
  # `shotBodyP`: chance a shot whose line crosses a defender's body is stopped by it.
  bodyRadius: {value: 0.315, initial: true}
  ballRadius: {value: 0.11, initial: true}
  bodyHeight: {value: 1.85, initial: true}
  bodyJumpBonus: {value: 0.3, initial: true}
  bodyGraceTicks: {value: 6, initial: true}
  bodyKeep: {value: 0.45, initial: false}
  bodyScatter: {value: 0.9, initial: false}
  shotBodyP: {value: 0.72, initial: false}

movement:
  v0: {value: 5.5, initial: true}
  v1: {value: 3.5, initial: true}
  a0m: {value: 3, initial: true}
  a1m: {value: 4, initial: true}
  sprintThreshold: {value: 7, initial: true}
  rArrive: {value: 2, initial: true}
  walkMax: {value: 2, initial: true}
  jogMax: {value: 5, initial: true}
  holdGain: {value: 0.35, initial: true}
  holdMaxSpeed: {value: 3, initial: true}
  # Dead ball: players walk briskly back to their restart positions (the hold gain alone would take ~3 s per metre of the last stretch).
  deadBallPace: {value: 2, initial: true}
  deadBallGain: {value: 4, initial: true}
  # Player bodies: centre-to-centre distance below which two players are pushed apart (m), the share of the overlap
  # closed per tick, and the most either player is moved in one tick (m).
  minPlayerSeparation: {value: 1.0, initial: true}
  separationStiffness: {value: 0.5, initial: true}
  separationMaxStep: {value: 0.2, initial: true}
  carryFraction: {value: 0.8, initial: true}
  chaseFraction: {value: 0.79, initial: false}
  sprintDist: {value: 32, initial: false}

fitness:
  c:
    walk: {value: 0.000015, initial: false, rate: true}
    jog: {value: 0.00012, initial: false, rate: true}
    run: {value: 0.00026, initial: false, rate: true}
    sprint: {value: 0.0006, initial: false, rate: true}
  rec: {value: 0.000032, initial: false, rate: true}
  s_phys: {value: 0.6, initial: true}
  s_ment: {value: 0.2, initial: true}
  threshold: {value: 0.7, initial: true}
  staminaBase: {value: 1.5, initial: true}
  staminaDiv: {value: 20, initial: true}
  workBase: {value: 0.8, initial: true}
  workDiv: {value: 50, initial: true}
  # Age (fitness/Fitness.js ageFactors): peak endurance up to peakMax drains at
  # 1.0x; each year past it adds perYear to the drain (capped at maxExtra: about
  # +12% at 31, +25% from 35-36), compounded by up to staminaComp for a low
  # Stamina attribute. recoveryShare of that extra also slows recovery.
  age:
    default: {value: 25, initial: true}  # years, when a player's input has no age
    peakMax: {value: 27, initial: true}
    perYear: {value: 0.03, initial: true}
    maxExtra: {value: 0.25, initial: true}
    staminaComp: {value: 0.3, initial: true}
    recoveryShare: {value: 0.5, initial: true}

ball:
  clearanceSpread: {value: 40, initial: false}  # m, lateral spread of a clearance
  rolling: {value: 0.6, initial: true, rate: true}
  landingKeep: {value: 0.3, initial: true}
  stopSpeed: {value: 0.1, initial: true}
  receiveRadius: {value: 1.2, initial: true}
  lockTicks: {value: 10, initial: true}
  looseSpeedMax: {value: 10, initial: true}
  arrivalSpeed: {value: 4, initial: true}
  gravity: {value: 9.81, initial: true}
  kinds:
    SHORT:
      peak: {value: 0, initial: true}
      speed: {value: 12, initial: true}
    THROUGH:
      peak: {value: 0, initial: true}
      speed: {value: 16, initial: true}
    SWITCH:
      peak: {value: 0, initial: true}
      speed: {value: 20, initial: true}
    LONG:
      peak: {value: 8, initial: true}
      speed: {value: 22, initial: true}
    CROSS:
      peak: {value: 4, initial: true}
      speed: {value: 20, initial: true}
    CLEARANCE:
      peak: {value: 12, initial: true}
      speed: {value: 25, initial: true}
    CHIP:
      peak: {value: 3, initial: true}
      speed: {value: 14, initial: true}

# Shared support spots (OffBallDecision.js updateSupportSpots). Every cadenceTicks the team with the ball scores 16
# spots on two rings (spotRadiusMin and spotRadiusMax metres) around the carrier: wLane x lane safety from the
# carrier, wDist x how close the pass is to optPassDist, wSpace x room from the nearest opponent, wXt x the xT gain,
# plus a hysteresis bonus for a spot within 3 m of one already held. The two best (apart) go to the nearest eligible
# midfielder, winger or striker within maxAssignDist, a player who already holds a spot counting hysteresisM metres
# nearer. Anybody else keeps the old ring (ringRadius, points) around their anchor.
support:
  ringRadius: {value: 6, initial: true}
  points: {value: 8, initial: true}
  cadenceTicks: {value: 10, initial: false}
  spotRadiusMin: {value: 9, initial: false}
  spotRadiusMax: {value: 18, initial: false}
  optPassDist: {value: 14, initial: false}
  wLane: {value: 1.0, initial: false}
  wDist: {value: 0.5, initial: false}
  wSpace: {value: 0.5, initial: false}
  wXt: {value: 8, initial: false}
  hysteresis: {value: 0.15, initial: false}
  hysteresisM: {value: 2, initial: false}
  maxAssignDist: {value: 7.5, initial: false}

# Phase-aware off-ball movement (OffBallDecision.js, Formation.js computeAnchors).
# In possession, once the carrier is past overlapAlong (the final third): the
# ball-side full-back overlaps down the wide channel (overlapWidth m from the
# touchline) while the ball-side winger comes inside to the half-space
# (wingerInside m from the centre line). A striker runs diagonally into the gap of
# the last line, ending runOnsideGap m onside, when a midfielder carrier between
# runAlong and overlapAlong has time to look up (pressure <= runPressureMax).
# One runner (RUN, at runFraction of top speed) per team at a time.
# Out of possession the shape slides compactShift of the way toward the ball's width.
offBall:
  overlapAlong: {value: 68, initial: false}
  overlapWidth: {value: 4, initial: false}
  wingerInside: {value: 13, initial: false}
  runAlong: {value: 45, initial: false}
  runOnsideGap: {value: 1, initial: false}
  runPressureMax: {value: 0.4, initial: false}
  runFraction: {value: 0.7, initial: false}  # share of top speed on a run
  transitionTicks: {value: 40, initial: false}  # ticks a team stays in a transition phase after winning or losing the ball
  compactShift: {value: 0.08, initial: false}   # forwards and wingers: share of the way toward the ball's side
  # Defensive and midfield lines (CB, FB, MF) out of possession: slide lineShift of the way toward the ball's y,
  # scaled by the ball's depth (own-frame x): lineDeepScale of it with the ball at or behind lineDeepX (stay
  # central to guard the box when the ball is wide in the defensive third), all of it from lineFullX on.
  # Players of one line are kept at least lineMinGap metres apart across the pitch.
  lineShift: {value: 0.3, initial: false}
  lineDeepScale: {value: 0.35, initial: false}
  lineDeepX: {value: 30, initial: false}
  lineFullX: {value: 60, initial: false}
  lineMinGap: {value: 6, initial: false}
  # Counter-press: for counterPressTicks after a team loses the ball at or beyond counterPressFrom metres up
  # the pitch (own frame), its nearest counterPressCount outfield players close down the new carrier from
  # counterPressZone x their normal press zone, without waiting for the usual press trigger.
  counterPressTicks: {value: 40, initial: false}
  counterPressFrom: {value: 35, initial: false}
  counterPressCount: {value: 1, initial: false}
  counterPressZone: {value: 1.3, initial: false}

setPieces:
  wallMaxDist: {value: 32, initial: true}
  wallDist: {value: 9.15, initial: true}
  wallMinPlayers: {value: 2, initial: true}
  wallMaxPlayers: {value: 5, initial: true}
  wallSpacing: {value: 0.75, initial: true}
  wallBlockHeight: {value: 1.85, initial: true}
  wallJumpBonus: {value: 0.45, initial: true}
  wallReachHalf: {value: 0.55, initial: true}
  wallSkillFactor: {value: 0.6, initial: true}
  wallClearBase: {value: 1.55, initial: true}
  fkDipAccel: {value: 7.5, initial: true}
  gkWallOffset: {value: 1.4, initial: true}
  cornerEdgeRadius: {value: 20, initial: true}
  cornerRestDefX: {value: 50, initial: true}
  cornerOutletX: {value: 52, initial: true}
  wideFkDist: {value: 27, initial: true}

# Morale and momentum (src/engine/morale/Morale.js). Morale is 0-100, 75 neutral; a
# player's level is 0 at `neutral`, +1 at `highRef`, -1 at `lowRef` (clamped to
# +-maxLevel). Each coefficient is the effect at level 1; between morale 30 and 95
# the execution swing is about 2x the coefficient (roughly 5-8% overall).
morale:
  neutral: {value: 75, initial: true}
  highRef: {value: 95, initial: true}
  lowRef: {value: 30, initial: true}
  maxLevel: {value: 1.25, initial: true}
  passLogit: {value: 0.07, initial: false}     # pass completion logit
  shotRadius: {value: 0.065, initial: false}    # shot error radius cut, x (0.5 + pressure)
  decisionNoise: {value: 0.06, initial: false}  # decision noise cut
  tackleLogit: {value: 0.06, initial: false}   # tackle win logit, tackler minus carrier level
  contestLogit: {value: 0.05, initial: false}   # interception and block logit
  pressSpeed: {value: 0.025, initial: false}    # pressing speed
  # How far a player follows the team shift: 1 - temper x mean(n(composure), n(determination)).
  temper: {value: 0.5, initial: true}
  # In-match momentum shift, in morale points, decaying by `decay` per second.
  events:
    goalFor: {value: 4, initial: true}
    goalAgainst: {value: 5, initial: true}
    redCardOwn: {value: 6, initial: true}
    redCardOpponent: {value: 2, initial: true}
  maxShift: {value: 15, initial: true}
  decay: {value: 0.0008, initial: true}
  # Individual morale (Morale.js onPlayerEvents): morale points from the player's
  # own actions, tempered like the team shift, bounded by maxShift and decaying
  # by `decay` per second.
  personal:
    goal: {value: 6, initial: true}
    ownGoal: {value: -6, initial: true}
    assist: {value: 4, initial: true}
    keyPass: {value: 0.8, initial: true}
    shotOnTarget: {value: 0.5, initial: true}
    bigChanceMissed: {value: -3, initial: true}
    save: {value: 1.5, initial: true}
    concededKeeper: {value: -3, initial: true}
    concededDefender: {value: -1.5, initial: true}
    yellowCard: {value: -2.5, initial: true}
    penaltyConceded: {value: -3, initial: true}
    possessionLost: {value: -0.4, initial: true}
    miscontrol: {value: -0.5, initial: true}
    tackleWon: {value: 0.4, initial: true}
    interception: {value: 0.3, initial: true}
    maxShift: {value: 20, initial: true}
    decay: {value: 0.002, initial: true}

