  possessionLost: {value: -0.05, initial: true}
  miscontrol: {value: -0.06, initial: true}
  foul: {value: -0.05, initial: true}
  penaltyConceded: {value: -0.5, initial: true}
  yellowCard: {value: -0.4, initial: true}
