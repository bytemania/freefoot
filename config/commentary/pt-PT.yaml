# Commentary templates, pt-PT (design item 19, G7). Strict i18n enabled.
GOAL:
  - "{minute}' GOLO! {player.name} marca pel{team.artDef} {team.name}!"
  - "{minute}' Bola no fundo das redes! {player.name} fatura para {team.artDef} {team.name}!"
  - "{minute}' GOLO {team.contractionDe} {team.name}! {player.name} não perdoa!"
ASSIST:
  - "{player.name} assiste {player2.name} com um passe primoroso."
  - "Excelente visão de jogo de {player.name} a servir {player2.name}."
  - "{player.name} oferece o golo a {player2.name}."
SHOT:
  - "{player.name} remata a {meta.distance} metros da baliza."
  - "{player.name} dispara à baliza a {meta.distance} metros."
  - "{player.name} tenta a sorte de longe, a {meta.distance} metros."
BIG_CHANCE:
  - "Grande oportunidade para {player.name}!"
  - "Ocasião flagrante para {player.name} em frente à baliza!"
  - "{player.name} fica em posição privilegiada — oportunidade de ouro!"
KEY_PASS:
  - "{player.name} rasga a defesa para isolar {player2.name}."
  - "Passe incisivo de {player.name} a descobrir {player2.name}."
  - "{player.name} encontra {player2.name} com um passe-chave."
CROSS:
  - "{player.name} cruza tenso para a área."
  - "{player.name} coloca a bola na grande área desde o flanco."
  - "{player.name} faz o cruzamento à procura de um colega."
DRIBBLE:
  - "{player.name} parte para cima do adversário."
  - "{player.name} finta o marcador com classe."
  - "{player.name} progride com bola controlada."
TOUCH_IN_BOX:
  - "{player.name} recebe a bola dentro da grande área."
  - "{player.name} domina com perigo na área adversária."
  - "{player.name} encontra espaço na área."
PASS:
  - "{player.name} passa para {player2.name}."
  - "{player.name} solicita {player2.name} com um passe curto."
  - "{player.name} entrega a bola a {player2.name}."
POSSESSION_LOST:
  - "{player.name} perde a posse de bola."
  - "{player.name} entrega a bola ao adversário."
  - "Perda de bola comprometedora de {player.name}."
MISCONTROL:
  - "Mau domínio de bola de {player.name}."
  - "{player.name} falha a receção e a bola escapa-se."
  - "Controlo defeituoso de {player.name}."
TACKLE:
  - "{player.name} entra ao desarme sobre {player2.name}."
  - "Corte decidido de {player.name} perante {player2.name}."
  - "{player.name} disputa o lance com {player2.name}."
INTERCEPTION:
  - "{player.name} lê bem o lance e intercetou o passe."
  - "Antecipação eficaz de {player.name} a cortar a linha de passe."
  - "{player.name} corta o passe com oportunidade."
CLEARANCE:
  - "{player.name} alivia para longe da zona de perigo."
  - "{player.name} despacha a bola sem arriscar."
  - "Alívio seguro de {player.name}."
BLOCK:
  - "{player.name} atira-se à bola e bloqueia o remate!"
  - "Corte providencial de {player.name} a travar o disparo!"
  - "{player.name} coloca o corpo à frente do remate."
AERIAL_DUEL:
  - "{player.name} sobe mais alto na disputa aérea com {player2.name}."
  - "Duelo pelo ar entre {player.name} e {player2.name}."
  - "{player.name} luta pelo cabeceamento com {player2.name}."
RECOVERY:
  - "{player.name} recupera a bola solta para {team.artDef} {team.name}."
  - "{player.name} recolhe a segunda bola a favor {team.contractionDe} {team.name}."
  - "Recuperação importante de {player.name} pel{team.artDef} {team.name}."
SAVE:
  - "Grande defesa de {player.name} a negar o golo!"
  - "{player.name} estica-se e segura o remate!"
  - "Intervenção decisiva de {player.name} entre os postes!"
CLAIM:
  - "{player.name} sai dos postes e segura o cruzamento com firmeza."
  - "Bola segura nas luvas de {player.name}."
  - "{player.name} domina a bola nas alturas."
PUNCH:
  - "{player.name} soca a bola para fora da área."
  - "{player.name} afasta o perigo a punhos."
  - "{player.name} opta por socar o cruzamento."
SMOTHER:
  - "{player.name} sai aos pés do avançado e fecha o ângulo!"
  - "Saída corajosa de {player.name} a abafar o remate!"
  - "{player.name} antecipa-se e segura a bola junto ao relvado!"
GK_DISTRIBUTION:
  - "{player.name} repõe a bola em jogo desde a área."
  - "{player.name} lança o ataque {team.contractionDe} {team.name}."
  - "Reposição rápida de {player.name}."
KICK_OFF:
  - "{minute}' Pontapé de saída {team.contractionDe} {team.name}."
  - "{minute}' Apita o árbitro e {team.artDef} {team.name} dá o pontapé de saída."
  - "{minute}' Recomeça a partida com {team.artDef} {team.name}."
THROW_IN:
  - "Lançamento lateral cobrado por {player.name}."
  - "{player.name} repõe a bola em jogo pela linha lateral."
  - "{player.name} efetua o lançamento para {team.artDef} {team.name}."
GOAL_KICK:
  - "Pontapé de baliza para {team.artDef} {team.name}, cobrado por {player.name}."
  - "{player.name} prepara o pontapé de baliza."
  - "{team.artDef} {team.name} recomeça a partir da sua área."
CORNER:
  - "{player.name} marca o pontapé de canto para {team.artDef} {team.name}."
  - "Canto a favor {team.contractionDe} {team.name} — {player.name} na marcação."
  - "{player.name} bate o canto para a área."
FREE_KICK:
  - "{player.name} prepara-se para bater o livre."
  - "Livre para {team.artDef} {team.name}, com {player.name} junto à bola."
  - "{player.name} assume a cobrança da bola parada."
PENALTY_AWARDED:
  - "{minute}' PENÁLTI para {team.artDef} {team.name}! {player2.name} foi derrubad{player2.g:o|a} na área!"
  - "{minute}' O árbitro aponta para a marca dos onze metros! Penálti após falta sobre {player2.name}."
  - "{minute}' Grande penalidade a favor {team.contractionDe} {team.name}! {player2.name} sofre a falta."
DROP_BALL:
  - "O árbitro recomeça o jogo com bola ao solo."
FOUL:
  - "Falta assinalada: {player.name} derruba {player2.name}."
  - "{player.name} chega atrasad{player.g:o|a} e faz falta sobre {player2.name}."
  - "Infração de {player.name} sobre {player2.name}."
OFFSIDE:
  - "Bandeira levantada — {player.name} está em fora de jogo."
  - "{player.name} adiantou-se à linha defensiva. Fora de jogo."
  - "Fora de jogo assinalado a {player.name}."
YELLOW_CARD:
  - "{minute}' Cartão amarelo exibido a {player.name}."
  - "{minute}' {player.name} vê a cartolina amarela."
  - "{minute}' Admoestação para {player.name} — cartão amarelo."
RED_CARD:
  - "{minute}' CARTÃO VERMELHO! {player.name} é expuls{player.g:o|a}!"
  - "{minute}' Ordem de expulsão para {player.name} — {team.artDef} {team.name} fica reduzid{team.g:o|a}!"
  - "{minute}' {player.name} recebe cartão vermelho e segue para os balneários!"
INJURY:
  - "{player.name} apresenta queixas físicas no relvado."
  - "Preocupação {team.contractionEm} {team.name}: {player.name} está lesionad{player.g:o|a}."
  - "{player.name} fica magoad{player.g:o|a} após o lance."
INJURY_STOPPAGE:
  - "O jogo está interrompido para assistência médica a {player.name}."
SUBSTITUTION:
  - "Substituição {team.contractionEm} {team.name}: {player2.name} entra para o lugar de {player.name}."
  - "Mexida {team.contractionEm} {team.name}: sai {player.name}, entra {player2.name}."
  - "{player.name} é substituíd{player.g:o|a} por {player2.name}."
FORMATION_CHANGE:
  - "{team.artDef} {team.name} altera o sistema para {meta.formationId}."
  - "Ajuste tático {team.contractionDe} {team.name}, agora em {meta.formationId}."
  - "{team.artDef} {team.name} passa a jogar em {meta.formationId}."
FORCED_DECISION_REQUIRED:
  - "{team.artDef} {team.name} tem de tomar uma decisão imediata."
ADDED_TIME:
  - "O quarto árbitro indica {meta.minutes} minuto(s) de compensação."
  - "Vão jogar-se mais {meta.minutes} minuto(s) de descontos."
  - "{meta.minutes} minuto(s) de tempo adicional."
HALF_TIME:
  - "Intervalo! O árbitro apita para o descanso."
FULL_TIME:
  - "Fim do jogo! Apito final na partida."
SHOUT_REACTION:
  - "Grito vindo do banco {team.contractionDe} {team.name}."
  - "O treinador {team.contractionDe} {team.name} levanta-se e dá ordens aos gritos."
  - "Instruções em voz alta na zona técnica {team.contractionDe} {team.name}."
# VAR: {player} é quem marcou, quem fez a falta ou quem viu o amarelo, e {team} a sua equipa; {opponent} é a outra.
VAR_CHECK:
  GOAL:
    - "Calma — o VAR está a verificar o golo de {player.name}."
    - "Festejos em suspenso: o VAR está a analisar o golo de {player.name}."
    - "Não tão depressa! O VAR revê o lance que deu o golo {team.contractionDe} {team.name}."
  PENALTY:
    - "O VAR está a verificar o penálti assinalado a {player.name}."
    - "O penálti ainda não é certo — o VAR analisa a entrada de {player.name}."
    - "O VAR confirma se {player.name} fez mesmo falta na grande penalidade."
  POSSIBLE_PENALTY:
    - "Jogo parado — o VAR quer rever a entrada de {player.name} na área."
    - "Verificação do VAR por possível penálti! {player.name} entrou forte na área."
    - "O árbitro interrompe o jogo: o VAR analisa um possível penálti a favor {opponent.contractionDe} {opponent.name}."
  RED_CARD:
    - "O VAR verifica se o amarelo de {player.name} deve ser vermelho."
    - "Possível cartão vermelho: o VAR revê a entrada de {player.name}."
    - "A entrada de {player.name} está a ser revista pelo VAR — o amarelo pode não ficar por aqui."
VAR_DECISION:
  goalConfirmed:
    - "Verificação concluída — o golo é válido! {player.name} pode voltar a festejar."
    - "Tudo em ordem para o VAR: o golo de {player.name} conta para {team.artDef} {team.name}."
    - "Sem problemas. O golo de {player.name} está confirmado."
  goalDisallowed:
    - "GOLO ANULADO! O VAR invalida o lance — {player.name} fica sem o golo e {team.artDef} {team.name} também."
    - "Anulado! O VAR detetou uma infração na jogada; o golo de {player.name} não conta."
    - "Desilusão para {team.artDef} {team.name}: o VAR anula o golo de {player.name}."
  penaltyConfirmed:
    - "Verificação concluída — mantém-se o penálti a favor {opponent.contractionDe} {opponent.name}."
    - "O VAR dá razão ao árbitro: {player.name} fez falta, o penálti mantém-se."
    - "Nada muda após a revisão. Continua a ser penálti para {opponent.artDef} {opponent.name}."
  penaltyOverturned:
    - "Penálti anulado! O VAR iliba {player.name} — não houve falta na área."
    - "O árbitro revê as imagens e muda de ideias: não há penálti, {player.name} jogou a bola."
    - "Alívio para {team.artDef} {team.name}! O VAR cancela o penálti assinalado a {player.name}."
  penaltyAwarded:
    - "PENÁLTI! Após a revisão do VAR, {player.name} é castigad{player.g:o|a} e {opponent.artDef} {opponent.name} tem grande penalidade."
    - "O árbitro vai ao monitor e aponta para a marca — {player.name} fez falta na área!"
    - "O VAR dá penálti a favor {opponent.contractionDe} {opponent.name}: a entrada de {player.name} foi falta."
  noPenalty:
    - "Verificação concluída — não há penálti. A entrada de {player.name} foi limpa."
    - "O VAR não vê nada de irregular na entrada de {player.name}. O jogo recomeça com bola ao solo."
    - "Nada de penálti para {opponent.artDef} {opponent.name}: a revisão iliba {player.name}."
  redCardUpgraded:
    - "VERMELHO após a revisão do VAR! O amarelo de {player.name} passa a vermelho e {team.artDef} {team.name} fica com dez."
    - "O árbitro vai ao monitor e volta com o vermelho — {player.name} é expuls{player.g:o|a}!"
    - "O VAR agrava a decisão: vermelho direto para {player.name}."
  yellowStands:
    - "Verificação concluída — mantém-se o amarelo para {player.name}."
    - "O VAR concorda com o amarelo; {player.name} continua em campo."
    - "Sem agravamento. {player.name} escapa com um cartão amarelo."
