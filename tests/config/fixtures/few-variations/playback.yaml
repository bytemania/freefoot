# Runtime playback settings (design item 16, §14).
highlights:
  bigChanceXg: 0.32
  majorSavePsxg: 0.35
ring:
  leadUpTicks: 300
  postRollTicks: 40
  extensionCapTicks: 160
  frames: 500
replay:
  speed: 1.5
  cap: 25
countdownSeconds: 5
fastForward:
  sliceMs: 8
  maxTicksPerFrame: 2000
maxTicksPerFrame: 20
maxFrameSeconds: 0.1
commentaryDomCap: 200
# Auto Highlights pacing (runtime/MatchController.js): only crucial moments play at 1x, calm play fast-forwards,
# so a full match takes about 3.5-4.5 minutes of wall-clock time (under 5).
autoHighlights:
  fastSpeed: 150               # x real time between highlights
  fastMaxTicksPerFrame: 50     # tick cap per frame while fast-forwarding (the live cap is maxTicksPerFrame)
  cooldownTicks: 60            # live ticks held after the last crucial tick (3 s)
  holdScale: 0.75              # share of the goal / red card / substitution animation holds kept
  leadUpGoalDist: 12           # m: a carrier this close to the goal centre plays live (the chance building)
  passTargetGoalDist: 9        # m: a pass in flight to a point this close to the goal centre plays live
  breakawayAlong: 80           # m from own goal: a carrier past this with no outfield defender ahead plays live
  freeKickDangerM: 22          # m: a direct free kick this close to goal plays live (with its set-up)
