# Morale and momentum (src/engine/morale/Morale.js). Morale is 0-100, 75 neutral; a
# player's level is 0 at `neutral`, +1 at `highRef`, -1 at `lowRef` (clamped to
# +-maxLevel). Each coefficient is the effect at level 1; between morale 30 and 95
# the execution swing is about 2x the coefficient (roughly 5-8% overall).
morale:
  neutral: {value: 75, initial: true}
  highRef: {value: 95, initial: true}
  lowRef: {value: 30, initial: true}
  maxLevel: {value: 1.25, initial: true}
  passLogit: {value: 0.12, initial: false}     # pass completion logit
  shotRadius: {value: 0.05, initial: false}    # shot error radius cut, x (0.5 + pressure)
  decisionNoise: {value: 0.1, initial: false}  # decision noise cut
  tackleLogit: {value: 0.12, initial: false}   # tackle win logit, tackler minus carrier level
  contestLogit: {value: 0.1, initial: false}   # interception and block logit
  pressSpeed: {value: 0.05, initial: false}    # pressing speed
  # How far a player follows the team shift: 1 - temper x mean(n(composure), n(determination)).
  temper: {value: 0.5, initial: true}
  # In-match momentum shift, in morale points, decaying by `decay` per second.
  events:
    goalFor: {value: 4, initial: true}
    goalAgainst: {value: 5, initial: true}
    redCardOwn: {value: 6, initial: true}
    redCardOpponent: {value: 2, initial: true}
  maxShift: {value: 15, initial: true}
  decay: {value: 0.0008, initial: true}

homeAdvantage: {value: 0, initial: true}
