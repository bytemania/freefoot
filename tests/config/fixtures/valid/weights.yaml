# Engine tuning coefficients (design §9a, §9b). Every value starts as `initial: true`
# and is changed only by calibration. `rate: true` values are per second;
# the engine converts them to per-tick values in create().

# Attribute contrast (state/PlayerMatchState.js getEffectiveAttribute): every
# attribute is read as pivot + contrast x (raw - pivot) before fitness and injury.
# Calibrated against the closing-odds strength tiers in config/benchmarks/top5-10yr.json.
attributes:
  pivot: {value: 15, initial: true}
  contrast: {value: 1, initial: false}

# Carrier decision model (§9a, §9b). w = feature weights per action.
decision:
  offsideMisjudge: {value: 1.5, initial: false}  # m, +-error in the carrier reading of the offside line
  throughLineGap: {value: 4, initial: false}  # m, a THROUGH ball goes to a receiver at most this far short of the line
  w:
    pass:
      laneSafety: {value: 1, initial: true}
      progress: {value: 1.2, initial: true}
      receiverFree: {value: 0.5, initial: true}
    dribble:
      space: {value: 0.8, initial: true}
      skill: {value: 0.4, initial: true}
    shot:
      xg: {value: 2.5, initial: true}
      bias: {value: 0, initial: false}
    cross:
      wideZone: {value: 0.6, initial: true}
      boxMates: {value: 0.8, initial: true}
    hold:
      free: {value: 0.3, initial: true}
  n0: {value: 0.3, initial: true}
  n1: {value: 0.5, initial: true}
  visionMin: {value: 12, initial: true}
  minPassDist: {value: 5, initial: true}
  maxPassDist: {value: 60, initial: true}
  shotMaxDist: {value: 35, initial: true}
  dribbleStep: {value: 8, initial: true}
  offsidePenalty: {value: 2, initial: true}
  settleTicks: {value: 30, initial: true}
  settlePressureTicks: {value: 10, initial: true}
  clearanceScore: {value: 1.2, initial: true}
  clearancePressure: {value: 0.5, initial: true}
  clearanceZone: {value: 25, initial: true}
  # Game state: shot-bias shift for the leading / trailing side, scaled by time played.
  gameState:
    leadShotBias: {value: -0.1, initial: false}
    trailShotBias: {value: 0.1, initial: false}
  features:
    laneSafetyDist: {value: 8, initial: true}
    progressScale: {value: 30, initial: true}
    pressureDist: {value: 5, initial: true}
    spaceDist: {value: 10, initial: true}
    spaceConeDeg: {value: 60, initial: true}
    boxMatesDiv: {value: 3, initial: true}
    dribbleAngleDeg: {value: 35, initial: true}
    interruptDist: {value: 2, initial: true}

