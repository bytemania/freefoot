    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: foulsCommitted
    unit: perTeam
    layer: L4
    hard: true
    bandA: [9, 15]
    scenarioB: {weakMoreThanStrong: {rule: weakGreaterThanStrong, hard: false}}
