# Calibration targets (design item 17, §18, §18a). Kept apart from weights, so tuning
# weights cannot change the targets they are measured against.
# Release gate: the 8 Scenario A hard metrics, plus the 3 Scenario B hard checks
# (strong-side possessionPct 60-70, strong-side xG share >= 0.75, strongWinRate 0.70-0.80).
# `reference` fields are written by scripts/build-reference.mjs; null until it has run.
# Scenario B entries are keyed `strong`, `weak`, or a named check; each has a `band` or a `rule`.
metrics:
  - id: goals
    unit: perTeam
    layer: L4
    hard: true
    bandA: [0.9, 1.9]
    scenarioB: {}
    tolerance: 0.2
    toleranceAbs: 0.5
    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: xG
    unit: perTeam
    layer: L4
    hard: true
    bandA: [0.8, 2.2]
    scenarioB: {strongShare: {band: [0.75, 1.0], hard: true}, strong: {band: [2.2, 3.5], hard: false}, weak: {band: [0.2, 0.7], hard: false}}
    tolerance: 0.2
    toleranceAbs: 0.15
    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: shots
    unit: perTeam
    layer: L4
    hard: true
    bandA: [8, 18]
    scenarioB: {}
    tolerance: 0.2
    toleranceAbs: 2
    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: shotsOnTarget
    unit: perTeam
    layer: L4
    hard: true
    bandA: [3, 6]
    scenarioB: {}
    tolerance: 0.2
    toleranceAbs: 1
    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: possessionPct
    unit: perTeam
    layer: L2
    hard: true
    bandA: [45, 55]
    scenarioB: {strong: {band: [60, 70], hard: true}}
    tolerance: 0.15
    toleranceAbs: 3
    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: passes
    unit: perTeam
    layer: L2
    hard: true
    bandA: [350, 650]
    scenarioB: {}
    tolerance: 0.15
    toleranceAbs: 40
    reference: {mean: null, p10: null, p90: null, ci90: null, source: null, extractorVersion: null, rows: null}
  - id: passCompletionPct
    unit: perTeam
    layer: L2
    hard: true
